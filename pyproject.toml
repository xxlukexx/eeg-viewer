[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-review-viewer"
version = "1.0.0"
description = "Fast read-only viewer for FieldTrip and EEGLAB EEG data"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mne>=1.10",
    "numpy>=1.26",
    "psutil>=5.9",
    "pymatreader>=1.2",
    "pyqtgraph>=0.14",
    "PySide6>=6.7",
    "scipy>=1.11",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
eeg-viewer = "eeg_viewer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
